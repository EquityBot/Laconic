name: tests

# Runs the whole Python suite and validates the evaluation cases. The other
# workflows each cover one layer; this catches the rest (eval tooling, judge,
# humanise metrics, OpenCode plugin).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # Without the binary, tests/test_mcp_server.py would skip.
      - name: Build laconic-check
        run: cargo build --locked --manifest-path tools/laconic-check/Cargo.toml
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate evaluation cases
        run: python scripts/run_evals.py validate
