version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses a workflow whose init, analyze and upload-sarif steps differ in version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # The pinned CLIs behind the load checks; see .github/ci/README.md.
  - package-ecosystem: npm
    directories:
      - /.github/ci/claude-code
      - /.github/ci/pi
    schedule:
      interval: weekly
  # Coverage for the Codecov upload, pinned by hash in requirements-coverage.txt.
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly
