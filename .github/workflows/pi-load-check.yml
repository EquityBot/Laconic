name: Pi package loads

on:
  pull_request:
    paths:
      - extensions/**
      - skills/**
      - package.json
      - scripts/check_pi_extension.py
      - .github/ci/pi/**
      - .github/workflows/pi-load-check.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Pi
        run: |
          npm ci --ignore-scripts --prefix .github/ci/pi
          echo "$GITHUB_WORKSPACE/.github/ci/pi/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify the Pi package, commands, status, and persisted mode
        run: python3 scripts/check_pi_extension.py
