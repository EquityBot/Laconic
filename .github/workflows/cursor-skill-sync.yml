name: cursor-skill in sync

# Fails if .cursor/skills/ drifts from the canonical skills/ folder, including
# both skills and their references. The .cursor copy is a real folder, not a
# symlink, so Windows clones and GitHub ZIP downloads work.
on:
  pull_request:
    paths:
      - skills/**
      - .cursor/skills/**
      - .github/workflows/cursor-skill-sync.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if the .cursor copy differs from skills
        run: |
          diff -r skills .cursor/skills || {
            echo "::error::.cursor copy is out of sync. Run: rm -rf .cursor/skills && cp -R skills .cursor/skills"
            exit 1
          }
