name: Fuzz

on:
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [lint, preserve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/laconic-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and the pinned cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      # The repository's own prose seeds the lint target.
      - name: Fuzz for 5 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET" fuzz/seeds
          if [ "$TARGET" = lint ]; then cp ../../README.md ../../CONTRIBUTING.md ../../skills/laconic-prose/SKILL.md fuzz/seeds/; fi
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" fuzz/seeds -- -max_total_time=300 -max_len=65536 -rss_limit_mb=4096
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: tools/laconic-check/fuzz/artifacts/${{ matrix.target }}
