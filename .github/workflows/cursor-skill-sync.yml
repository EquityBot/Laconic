name: cursor-skill in sync

# Fails if .cursor/skills/laconic/ drifts from the canonical skills/laconic/
# folder, including its references. The .cursor copy is a real folder, not a
# symlink, so Windows clones and GitHub ZIP downloads work.
on:
  pull_request:
    paths:
      - skills/laconic/**
      - .cursor/skills/**
      - .github/workflows/cursor-skill-sync.yml
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the .cursor copy differs from skills/laconic
        run: |
          diff -r skills/laconic .cursor/skills/laconic || {
            echo "::error::.cursor copy is out of sync. Run: rm -rf .cursor/skills/laconic && cp -R skills/laconic .cursor/skills/laconic"
            exit 1
          }
